<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Mask</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Image Grid Mask</h1>
    <input type="file" id="imageLoader" name="imageLoader" accept="image/*">
    <canvas id="canvas"></canvas>
    <div class="controls">
        <label for="grid-count">Grid Count:</label>
        <input type="number" id="grid-count" name="grid-count" min="1" max="100" value="10">
        <input type="range" id="grid-slider" name="grid-slider" min="1" max="100" value="10">
        <button id="apply-button">Apply Mask</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
